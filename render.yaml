# Optional persistent API host. The disk requires a paid Render service.
# Review hosting costs before applying this blueprint.
services:
  - type: web
    name: zew-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    disk:
      name: zew-demo-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/data/zew.sqlite
      - key: FRONTEND_ORIGIN
        sync: false
